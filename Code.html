<!DOCTYPE html>
<html>
<head>
  <title>Step 2</title>
</head>
<body>

<h2>Enter 6-Digit Code</h2>

<form>
  <input
    type="text"
    name="code"
    maxlength="6"
    pattern="[0-9]{6}"
    placeholder="123456"
    required>

  <br><br>

  <button type="submit">Submit</button>
</form>

</body>
</html>
